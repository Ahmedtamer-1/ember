<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ember-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2024" />
      <stop offset="100%" stop-color="#121013" />
    </radialGradient>
    <linearGradient id="flame-outer" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="50%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffbe0b" />
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ff5400" />
      <stop offset="100%" stop-color="#ffdd00" />
    </linearGradient>
    <linearGradient id="core-glow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#ember-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#ff7b00" stroke-width="2" stroke-opacity="0.3" />

  <!-- Ambient Glow Behind Flame -->
  <circle cx="256" cy="270" r="140" fill="#ff5400" opacity="0.25" filter="url(#glow)" />

  <!-- Outer Flame Body -->
  <path d="M 256,70 
           C 280,140 330,180 370,240 
           C 415,310 400,390 340,435 
           C 290,470 210,470 165,430 
           C 110,380 105,300 150,230 
           C 175,190 220,165 230,120 
           C 235,100 245,80 256,70 Z" 
        fill="url(#flame-outer)" />

  <!-- Inner Dynamic Flame Shape -->
  <path d="M 256,160 
           C 275,210 320,245 330,295 
           C 345,355 295,410 240,410 
           C 185,410 165,360 180,310 
           C 192,270 230,240 240,210 
           C 246,190 252,175 256,160 Z" 
        fill="url(#flame-inner)" />

  <!-- Hot Core Spark -->
  <path d="M 256,260 
           C 270,290 290,320 280,350 
           C 270,375 240,380 230,365 
           C 220,350 230,325 245,300 
           C 250,290 253,275 256,260 Z" 
        fill="url(#core-glow)" />
</svg>

