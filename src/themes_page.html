<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Themes</title>
<style>/*__SHARED_CSS__*/
.page-wrap { max-width: 980px; }
.toolbar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.master { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; }
.master-title { font-size: 16px; font-weight: 600; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.preset { border: 2px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--surface); transition: transform .12s ease, border-color .12s ease; text-align: left; padding: 0; color: var(--text); font: inherit; }
.preset:hover { transform: translateY(-2px); border-color: var(--accent); }
.preset .sw { height: 64px; position: relative; }
.preset .sw .bar { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 14px; border-radius: 7px; }
.preset .sw .dot { position: absolute; left: 14px; top: 12px; width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
.preset .nm { padding: 8px 10px; font-size: 12px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0 18px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--border); min-height: 46px; }
.trow:last-child { border-bottom: none; }
.trow label { font-size: 13px; }
.trow .hint { font-size: 11px; color: var(--muted); }
.color-ctl { display: flex; align-items: center; gap: 6px; }
.color-ctl input[type=color] { width: 34px; height: 28px; border: 1px solid var(--border); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
.color-ctl input[type=text] { width: 150px; height: 28px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.color-ctl input[type=text].bad { border-color: var(--danger); }
.clear-btn { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 2px; }
.clear-btn:hover { color: var(--danger); }
.range-ctl { display: flex; align-items: center; gap: 8px; }
.range-ctl input[type=range] { width: 160px; accent-color: var(--accent); }
.range-ctl .val { width: 44px; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: var(--surface); color: var(--text); padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--accent); color: #fff; }
.img-drop { display: flex; align-items: center; gap: 10px; }
.img-thumb { width: 72px; height: 44px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-hover) center/cover no-repeat; }
.tabs-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs-nav button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.tabs-nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.panel { display: none; }
.panel.on { display: block; }
.json-box { width: 100%; min-height: 160px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: 10px; resize: vertical; user-select: text; }
#toast { position: fixed; bottom: 22px; right: 24px; padding: 9px 14px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
#toast.show { opacity: 1; }
.off-note { color: var(--muted); font-size: 12px; margin-top: 4px; }
.sub-head { padding: 12px 16px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
.vid-status { font-size: 12px; color: var(--muted); min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
.preset .anim-tag { position: absolute; right: 8px; top: 8px; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <h1>Themes</h1>
    <div class="nav-links">
      <button class="pill-btn" onclick="emberSend('settings_action:open:ember://settings')">&#9881; Settings</button>
      <button class="pill-btn" onclick="emberSend('settings_action:open:ember://newtab')">New Tab</button>
    </div>
  </div>

  <div class="section">
    <div class="card master">
      <div>
        <div class="master-title">Custom theme</div>
        <div class="off-note" id="master-note">Changes preview live in the toolbar and are saved automatically.</div>
      </div>
      <div class="toolbar-row">
        <button class="btn" onclick="randomize()" title="Generate a random theme">&#127922; Surprise me</button>
        <button class="btn" onclick="resetAll()">Reset</button>
        <input class="switch" type="checkbox" id="enabled" onchange="setKey('enabled', this.checked ? 'true' : 'false', true)">
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Presets</h2>
    <div class="presets" id="presets"></div>
  </div>

  <div class="tabs-nav" id="tabs-nav">
    <button data-p="colors" class="on">Colors</button>
    <button data-p="pages">Page colors</button>
    <button data-p="shape">Shape &amp; layout</button>
    <button data-p="type">Typography</button>
    <button data-p="bg">Background</button>
    <button data-p="effects">Effects</button>
    <button data-p="share">Import / Export</button>
  </div>

  <div class="panel on" id="p-colors"><div class="card grid2" id="colors-grid"></div></div>
  <div class="panel" id="p-pages"><div class="card grid2" id="pages-grid"></div></div>
  <div class="panel" id="p-shape"><div class="card" id="shape-box"></div></div>
  <div class="panel" id="p-type"><div class="card" id="type-box"></div></div>
  <div class="panel" id="p-bg"><div class="card" id="bg-box"></div></div>
  <div class="panel" id="p-effects"><div class="card" id="fx-box"></div></div>
  <div class="panel" id="p-share">
    <div class="card" style="padding:16px 20px;">
      <div class="toolbar-row" style="margin-bottom:10px;">
        <button class="btn primary" onclick="exportFile()">Export file</button>
        <button class="btn" onclick="copyJson()">Copy JSON</button>
        <button class="btn" onclick="document.getElementById('import-file').click()">Import file</button>
        <button class="btn" onclick="importText()">Apply JSON below</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importFile(this)">
      </div>
      <textarea class="json-box" id="json-box" spellcheck="false" placeholder="Paste a theme JSON here, or press Copy JSON to see the current one."></textarea>
    </div>
  </div>
</div>
<div id="toast"></div>

var FONTS = [

/* ---------- video wallpaper upload ---------- */
// The file is streamed to Ember in base64 chunks; each chunk waits for Ember's ack, so only
// one chunk is ever in flight. Ember stores it as wallpaper.<ext> (never inside the theme).
var MAX_VIDEO = 50 * 1024 * 1024, VIDEO_CHUNK = 768 * 1024;
var upload = null, videoStatus = null;
function setVideoStatus(t) { if (videoStatus) videoStatus.textContent = t; }
function videoLabel() { return state.video ? "wallpaper." + state.video : "No video"; }
function videoCtl() {
  var box = el("div", { "class": "img-drop" });
  videoStatus = el("span", { "class": "vid-status" });
  var file = el("input", { type: "file", accept: "video/mp4,video/webm,.mp4,.webm" }); file.style.display = "none";
  var pick = el("button", { "class": "btn" }, "Choose video&#8230;");
  var clr = el("button", { "class": "clear-btn", title: "Remove video" }, "&#215;");
  pick.addEventListener("click", function () { if (!upload) file.click(); });
  file.addEventListener("change", function () {
    var f = file.files && file.files[0]; file.value = ""; if (!f) return;
    var ext = /\.webm$/i.test(f.name) || f.type === "video/webm" ? "webm" : (/\.mp4$/i.test(f.name) || f.type === "video/mp4" ? "mp4" : "");
    if (!ext) { toast("Only MP4 and WebM videos are supported"); return; }
    if (f.size > MAX_VIDEO) { toast("Video too large (max 50 MB)"); return; }
    if (!f.size) { toast("That file is empty"); return; }
    upload = { file: f, ext: ext, seq: 0, offset: 0 };
    setVideoStatus("Uploading 0%");
    emberSend("wallpaper_begin:" + ext + ":" + f.size);
  });
  clr.addEventListener("click", function () {
    upload = null; emberSend("wallpaper_clear");
    if (state.bg_mode === "video") state.bg_mode = "none";
    setKey("video", "", true); refreshAll();
  });
  refreshers.push(function () { if (!upload) setVideoStatus(videoLabel()); });
  box.appendChild(videoStatus); box.appendChild(pick); box.appendChild(clr); box.appendChild(file);
  setVideoStatus(videoLabel());
  return box;
}
function sendNextChunk() {
  var u = upload; if (!u) return;
  if (u.offset >= u.file.size) { emberSend("wallpaper_end"); return; }
  var blob = u.file.slice(u.offset, u.offset + VIDEO_CHUNK);
  var rd = new FileReader();
  rd.onload = function () {
    if (upload !== u) return;
    var s = String(rd.result);
    u.offset += blob.size;
    emberSend("wallpaper_chunk:" + u.seq + ":" + s.slice(s.indexOf(",") + 1));
    u.seq++;
  };
  rd.onerror = function () { upload = null; setVideoStatus(videoLabel()); toast("Could not read the video file"); };
  rd.readAsDataURL(blob);
}
window.__emberWallpaperUpload = function (stage, ok, detail) {
  if (!upload) return;
  if (!ok) { upload = null; setVideoStatus(videoLabel()); toast("Video upload failed: " + detail); return; }
  if (stage === "end") {
    upload = null; state.bg_mode = "video";
    setKey("video", detail, true); refreshAll(); toast("Video wallpaper set");
    return;
  }
  setVideoStatus("Uploading " + Math.floor(100 * upload.offset / upload.file.size) + "%");
  sendNextChunk();
};
// Switch whose default (key absent) is ON.
function switchOnCtl(key) {
  var c = el("input", { type: "checkbox", "class": "switch" });
  c.addEventListener("change", function () { setKey(key, c.checked ? "true" : "false", true); });
  function refresh() { c.checked = state[key] !== "false"; }

}

function replaceState(v, enable) {

/* ---------- random ---------- */
function hsl(h, s, l) { return "hsl(" + Math.round(h) + " " + Math.round(s) + "% " + Math.round(l) + "%)"; }
function randomize() {
  var h = Math.random() * 360, dark = Math.random() < 0.6, h2 = (h + 30 + Math.random() * 120) % 360;
  var L = dark ? function (x) { return x; } : function (x) { return 100 - x; };
  var styles = ["classic", "pill", "underline", "flat"], kinds = ["linear", "radial", "conic"];
  var v = {
    name: "Surprise", mode: dark ? "dark" : "light",
    accent: hsl(h2, 85, dark ? 62 : 45),
    tab_strip_bg: hsl(h, 30, L(9)), tab_active_bg: hsl(h, 28, L(18)), toolbar_bg: hsl(h, 28, L(18)),
    toolbar_border: hsl(h, 25, L(26)), omnibox_bg: hsl(h, 30, L(11)), omnibox_focus_bg: hsl(h, 30, L(11)),
    text_primary: hsl(h, 30, L(94)), text_secondary: hsl(h, 18, L(68)),
    dropdown_bg: hsl(h, 28, L(14)), dropdown_border: hsl(h, 25, L(28)),
    page_bg: hsl(h, 30, L(8)), page_surface: hsl(h, 28, L(14)), page_surface_hover: hsl(h, 28, L(20)),
    page_border: hsl(h, 25, L(24)), page_text: hsl(h, 30, L(94)), page_muted: hsl(h, 18, L(66)),
    tab_style: styles[Math.floor(Math.random() * styles.length)],
    radius_tab: String(Math.round(Math.random() * 16)), radius_omnibox: String(Math.round(Math.random() * 20)),
    active_glow: Math.random() < 0.4 ? "true" : "false"
  };
  if (Math.random() < 0.7) {
    v.bg_mode = "gradient"; v.gradient_kind = kinds[Math.floor(Math.random() * 3)];
    v.gradient_angle = String(Math.round(Math.random() * 72) * 5);
    v.gradient_from = hsl(h, 70, dark ? 25 : 80); v.gradient_via = hsl(h2, 75, dark ? 40 : 70); v.gradient_to = hsl((h2 + 60) % 360, 70, dark ? 30 : 85);
    v.bg_strength = String(35 + Math.round(Math.random() * 40)); v.bg_target = "both";
    if (Math.random() < 0.35) { v.bg_mode = "animated"; v.anim_style = ["flow", "hue", "pulse", "aurora"][Math.floor(Math.random() * 4)]; }
  }
  replaceState(v, true);
  toast("Surprise!");
}

/* ---------- import / export ---------- */
function themeJson() {
  var o = { ember_theme: 1 };
  Object.keys(state).forEach(function (k) { o[k] = state[k]; });
  return JSON.stringify(o, null, 2);
}
function exportFile() {
  var name = (state.name || "ember-theme").replace(/[^A-Za-z0-9_-]+/g, "-").toLowerCase();
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([themeJson()], { type: "application/json" }));
  a.download = name + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  toast("Exported to Downloads");
}
function copyJson() {
  var box = document.getElementById("json-box");
  box.value = themeJson();
  box.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(function () { toast("Copied"); }, function () { toast(ok ? "Copied" : "Select and copy the text below"); });
  else toast(ok ? "Copied" : "Select and copy the text below");
}
function applyJson(text) {
  var o;
  try { o = JSON.parse(text); } catch (e) { toast("That is not valid JSON"); return; }
  if (!o || typeof o !== "object" || Array.isArray(o)) { toast("Not a theme file"); return; }
  var v = {};
  Object.keys(o).forEach(function (k) {
    if (k === "ember_theme") return;
    if (/^[a-z_]{1,32}$/.test(k) && (typeof o[k] === "string" || typeof o[k] === "number" || typeof o[k] === "boolean")) v[k] = String(o[k]);
  });
  replaceState(v, v.enabled !== "false");
  toast("Theme imported");
}
function importText() { applyJson(document.getElementById("json-box").value); }
function importFile(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast("File too large"); return; }
  var rd = new FileReader();
  rd.onload = function () { applyJson(String(rd.result)); };
  rd.readAsText(f); inp.value = "";
}

window.__emberSetCustomTheme = function (css) {
  var e = document.getElementById("ember-custom-theme");
  if (!e) { e = document.createElement("style"); e.id = "ember-custom-theme"; document.head.appendChild(e); }
  e.textContent = typeof css === "string" ? css : "";
};
state = THEME || {};

refreshAll();
